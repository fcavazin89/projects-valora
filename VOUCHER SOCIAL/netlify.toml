[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Variáveis de ambiente de produção
# Configure em: Netlify > Site > Environment Variables
# NEXT_PUBLIC_WEB3AUTH_CLIENT_ID         = BMtfs9bDQu20v7ZcW-Y92v3EOBXgEh4Gcmj0QOpufg1LNBFS4MxroXjNDvYMRMJVDIinvsAv9Up2rjqdMvWjmtE
# NEXT_PUBLIC_API_URL                    = https://sua-valora-api.com
# NEXT_PUBLIC_MERCHANT_APP_URL           = https://comerciante.netlify.app
# NEXT_PUBLIC_APP_URL                    = https://voucher.netlify.app
# NEXT_PUBLIC_CHAIN_ID                   = 11155111
# NEXT_PUBLIC_RPC_URL                    = https://rpc.ankr.com/eth_sepolia
# NEXT_PUBLIC_VOUCHER_CONTRACT_ADDRESS   = 0x...
# CONTRACT_ADMIN_PRIVATE_KEY             = 0x...  (NUNCA expor no client)

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker do PWA
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
